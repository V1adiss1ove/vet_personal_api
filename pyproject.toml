[project]
name = "vet-personal-api"
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.163.0,<0.164.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "sqlalchemy[asyncio] (>=2.1.8,<3.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "pydantic-settings (>=2.16.3,<3.0.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "pyjwt (>=2.15.1,<3.0.0)",
    "bcrypt (>=5.0.0,<6.0.0)",
    "pydantic[email] (>=2.14.4,<3.0.0)"
]

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "ruff (>=0.17.5,<0.18.0)"
]
